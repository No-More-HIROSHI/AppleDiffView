<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-header">
        <img src="icon_48.png" alt="">
        <span class="popup-header-title" id="headerTitle"></span>
    </div>

    <div id="mainContent">
        <div class="status-section">
            <span class="status-badge active">
                <span class="status-dot"></span>
                <span id="statusText"></span>
            </span>
            <span class="diff-count" id="diffCountText"></span>
        </div>

        <div class="card">
            <div class="card-row">
                <div class="card-row-label">
                    <span class="card-row-title" id="highlightLabel"></span>
                    <span class="card-row-sub"   id="highlightSub"></span>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="highlightToggle" checked>
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="card-row">
                <div class="card-row-label">
                    <span class="card-row-title" id="diffOnlyLabel"></span>
                    <span class="card-row-sub"   id="diffOnlySub"></span>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="diffOnlyToggle">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="notTargetContent" style="display:none;">
        <div class="not-target-section">
            <div class="icon">🔍</div>
            <div id="notTargetText"></div>
        </div>
    </div>

    <div class="popup-footer">
        <button class="footer-btn" id="fortuneButton"></button>
        <a class="footer-btn" id="donationLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>

    <script src="constants.js"></script>
    <script src="popup.js"></script>
</body>
</html>
